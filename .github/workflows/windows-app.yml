name: Windows Rewards App

on:
    workflow_dispatch:
    workflow_call:
    push:
        branches:
            - windows-app-account-manager
            - windows-app-manual-config
        paths:
            - 'windows-app/**'
            - 'src/**'
            - '.github/workflows/windows-app.yml'
    pull_request:
        types:
            - opened
            - synchronize
            - reopened
            - ready_for_review
        paths:
            - 'windows-app/**'
            - 'src/**'
            - 'manager/RewardsManager/**'
            - 'autorun/**'
            - '.github/workflows/windows-app.yml'

permissions:
    contents: read

jobs:
    build-windows-app:
        runs-on: windows-latest
        timeout-minutes: 45

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: '8.0.x'

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '24.x'

            - name: Build Rewards bot
              shell: pwsh
              env:
                  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/staging/runtime/browser
                  PATCHRIGHT_BROWSERS_PATH: ${{ github.workspace }}/staging/runtime/browser
              run: |
                  $ErrorActionPreference = 'Stop'

                  New-Item -ItemType Directory -Path staging/runtime/browser -Force | Out-Null

                  npm ci
                  npx patchright install chromium
                  npm run build

                  # The shipped dist does not require devDependencies; remove them before packaging.
                  npm prune --omit=dev

                  New-Item -ItemType Directory -Path staging/bot -Force | Out-Null
                  Copy-Item package.json staging/bot/package.json -Force
                  Copy-Item package-lock.json staging/bot/package-lock.json -Force
                  Copy-Item config.example.json staging/bot/config.example.json -Force
                  Copy-Item dist staging/bot/dist -Recurse -Force
                  Copy-Item node_modules staging/bot/node_modules -Recurse -Force
                  Copy-Item scripts staging/bot/scripts -Recurse -Force
                  Copy-Item config.example.json staging/bot/config.json -Force
                  Set-Content staging/bot/bundle-version.txt '${{ github.sha }}' -NoNewline

            - name: Test Rewards browser locale
              shell: pwsh
              env:
                  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/staging/runtime/browser
                  PATCHRIGHT_BROWSERS_PATH: ${{ github.workspace }}/staging/runtime/browser
              run: |
                  $ErrorActionPreference = 'Continue'
                  node scripts/tests/locale-browser-smoke.cjs *> locale-browser-smoke.log
                  $code = $LASTEXITCODE
                  Get-Content locale-browser-smoke.log
                  exit $code

            - name: Upload locale failure diagnostics
              if: ${{ always() }}
              uses: actions/upload-artifact@v4
              with:
                  name: locale-browser-smoke-${{ github.run_number }}
                  path: locale-browser-smoke.log
                  if-no-files-found: ignore

            - name: Build dashboard
              shell: pwsh
              run: |
                  $ErrorActionPreference = 'Stop'

                  git clone --depth 1 https://github.com/mgrimace/rewards-dashboard.git dashboard-source
                  git -C dashboard-source checkout 0afbfe8aebbe37264a47c7db5e28832946b30fea

                  New-Item -ItemType Directory -Path staging/dashboard -Force | Out-Null
                  Copy-Item dashboard-source/rewards-dashboard/* staging/dashboard -Recurse -Force
                  Set-Content staging/dashboard/bundle-version.txt '${{ github.sha }}' -NoNewline

            - name: Bundle Node runtime
              shell: pwsh
              run: |
                  $ErrorActionPreference = 'Stop'

                  $nodeExe = (Get-Command node.exe).Source
                  $nodeDir = Split-Path $nodeExe -Parent

                  New-Item -ItemType Directory -Path staging/runtime/node -Force | Out-Null
                  Copy-Item "$nodeDir/*" staging/runtime/node -Recurse -Force

            - name: Publish Windows application
              shell: pwsh
              run: |
                  $ErrorActionPreference = 'Stop'

                  dotnet publish windows-app/MicrosoftRewardsApp.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None --output staging/app

            - name: Publish original desktop manager
              shell: pwsh
              run: |
                  $ErrorActionPreference = 'Stop'

                  dotnet publish manager/RewardsManager/RewardsManager.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None --output staging/manager

            - name: Assemble portable application
              shell: pwsh
              run: |
                  $ErrorActionPreference = 'Stop'

                  New-Item -ItemType Directory -Path artifact -Force | Out-Null

                  # Root the bot/runtime files so the original desktop manager sees the same portable layout.
                  Copy-Item staging/bot/* artifact -Recurse -Force
                  Copy-Item staging/dashboard artifact/dashboard -Recurse -Force
                  Copy-Item staging/runtime artifact/runtime -Recurse -Force
                  Copy-Item autorun artifact/autorun -Recurse -Force

                  # Ship the English Windows app as the main executable users launch.
                  Copy-Item staging/app/MicrosoftRewardsApp.exe artifact/MicrosoftRewardsApp.exe -Force
                  Copy-Item staging/app/MicrosoftRewardsApp.exe artifact/MicrosoftRewardsAccountManager.exe -Force

                  # Retain the original four-tab desktop manager as an optional executable.
                  Copy-Item staging/manager/RewardsManager.exe artifact/RewardsManager.exe -Force

            - name: Validate application package
              shell: pwsh
              run: |
                  $ErrorActionPreference = 'Stop'

                  if (!(Test-Path artifact/MicrosoftRewardsApp.exe)) {
                      throw 'Main English MicrosoftRewardsApp.exe was not produced.'
                  }

                  if (!(Test-Path artifact/MicrosoftRewardsAccountManager.exe)) {
                      throw 'Optional MicrosoftRewardsAccountManager.exe was not produced.'
                  }

                  if (!(Test-Path artifact/runtime/node/node.exe)) {
                      throw 'Bundled Node runtime is missing.'
                  }

                  if (!(Test-Path artifact/package.json)) {
                      throw 'Root package.json is missing.'
                  }

                  if (!(Test-Path artifact/dist/index.js)) {
                      throw 'Built Rewards bot is missing.'
                  }

                  if (!(Test-Path artifact/scripts/api/server.js)) {
                      throw 'Control API is missing.'
                  }

                  if (!(Test-Path artifact/autorun/run-rewards.ps1)) {
                      throw 'Rewards automation script is missing.'
                  }

                  if (!(Test-Path artifact/RewardsManager.exe)) {
                      throw 'Original desktop RewardsManager.exe was not produced.'
                  }

                  if (!(Test-Path artifact/dashboard/server.js)) {
                      throw 'Dashboard server is missing.'
                  }

                  if (!(Get-ChildItem artifact/runtime/browser -Recurse -ErrorAction SilentlyContinue)) {
                      throw 'Browser runtime is missing.'
                  }

                  & artifact/runtime/node/node.exe --version

            - name: Verify original desktop runtime
              shell: pwsh
              run: |
                  $ErrorActionPreference = 'Stop'
                  $process = Start-Process -FilePath "$PWD/artifact/RewardsManager.exe" -ArgumentList '--verify-runtime' -PassThru -WindowStyle Hidden
                  if (!$process.WaitForExit(60000)) {
                      Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
                      throw 'RewardsManager.exe runtime verification exceeded the 60 second limit.'
                  }
                  if ($process.ExitCode -ne 0) {
                      throw "RewardsManager.exe runtime verification failed with exit code $($process.ExitCode)."
                  }

            - name: Verify original desktop UI
              shell: pwsh
              run: |
                  $ErrorActionPreference = 'Stop'
                  $process = Start-Process -FilePath "$PWD/artifact/RewardsManager.exe" -ArgumentList '--verify-switch' -PassThru -WindowStyle Hidden
                  if (!$process.WaitForExit(60000)) {
                      Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
                      throw 'RewardsManager.exe UI verification exceeded the 60 second limit.'
                  }
                  if ($process.ExitCode -ne 0) {
                      throw "RewardsManager.exe UI verification failed with exit code $($process.ExitCode)."
                  }

            - name: Run integrated English app self-test
              shell: pwsh
              run: |
                  $ErrorActionPreference = 'Continue'

                  $process = Start-Process -FilePath "$PWD/artifact/MicrosoftRewardsApp.exe" -ArgumentList '--self-test' -PassThru -WindowStyle Hidden -RedirectStandardOutput "$PWD/account-manager-self-test.log" -RedirectStandardError "$PWD/account-manager-self-test.err.log"

                  try {
                      if (!$process.WaitForExit(60000)) {
                          Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
                          throw 'MicrosoftRewardsApp.exe self-test exceeded the 60 second limit.'
                      }

                      Get-Content "$PWD/account-manager-self-test.log" -ErrorAction SilentlyContinue
                      Get-Content "$PWD/account-manager-self-test.err.log" -ErrorAction SilentlyContinue

                      if ($process.ExitCode -ne 0) {
                          throw "MicrosoftRewardsApp.exe self-test failed with exit code $($process.ExitCode)."
                      }
                  }
                  finally {
                      if (!$process.HasExited) {
                          Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
                      }
                  }

            - name: Upload account-manager self-test diagnostics
              if: ${{ always() }}
              uses: actions/upload-artifact@v4
              with:
                  name: english-app-self-test-${{ github.run_number }}
                  path: |
                      account-manager-self-test.log
                      account-manager-self-test.err.log
                  if-no-files-found: ignore

            - name: Verify account-manager background startup
              shell: pwsh
              run: |
                  $ErrorActionPreference = 'Stop'

                  $process = Start-Process -FilePath "$PWD/artifact/MicrosoftRewardsApp.exe" -ArgumentList '--background' -PassThru -WindowStyle Hidden

                  try {
                      Start-Sleep -Seconds 8

                      if ($process.HasExited) {
                          throw "MicrosoftRewardsApp.exe exited during background startup with code $($process.ExitCode)."
                      }

                      $statePath = Join-Path $env:LOCALAPPDATA 'MicrosoftRewardsApp\state.dat'

                      if (!(Test-Path $statePath)) {
                          throw 'Application did not initialize its persistent state store during background startup.'
                      }
                  }
                  finally {
                      if (!$process.HasExited) {
                          Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
                      }
                  }

            - name: Zip portable application
              shell: pwsh
              run: |
                  $ErrorActionPreference = 'Stop'
                  Compress-Archive -Path artifact/* -DestinationPath MicrosoftRewardsApp-Windows-x64.zip -CompressionLevel Optimal

            - name: Upload application artifact
              uses: actions/upload-artifact@v4
              with:
                  name: MicrosoftRewardsApp-Windows-x64
                  path: MicrosoftRewardsApp-Windows-x64.zip
