name: Formatting Check

on:
    pull_request:
        types:
            - opened
            - synchronize
            - reopened
            - ready_for_review
    workflow_dispatch:

concurrency:
    group: formatting-check-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    checks: write
    issues: write
    pull-requests: write

jobs:
    check-formatting:
        name: Check formatting
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Check formatting of changed files
              shell: bash
              run: |
                  set -euo pipefail

                  if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
                    base="${{ github.event.pull_request.base.sha }}"
                    head="$GITHUB_SHA"
                  else
                    base="$(git rev-parse HEAD^)"
                    head="$GITHUB_SHA"
                  fi

                  mapfile -t files < <(
                    git diff --name-only "$base" "$head" --diff-filter=ACMR |
                      grep -E '\\.(cjs|css|html|js|json|md|mdx|mjs|scss|ts|tsx|yaml|yml)$' || true
                  )

                  if [ "${#files[@]}" -eq 0 ]; then
                    echo "No Prettier-supported files changed."
                    exit 0
                  fi

                  npx prettier --check "${files[@]}"
